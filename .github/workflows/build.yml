name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\src\BlueBridge.csproj -r win-x64

      - name: Build
        run: dotnet build .\src\BlueBridge.csproj -c Release --no-restore -warnaserror

      - name: Publish
        run: dotnet publish .\src\BlueBridge.csproj -c Release -r win-x64 --self-contained true --no-restore -o .\artifacts\publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueBridge-win-x64
          path: artifacts/publish/

      - name: Prepare release package
        if: startsWith(github.event.head_commit.message, 'Release BlueBridge')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\artifacts\package\App -Force | Out-Null
          Copy-Item .\artifacts\publish\* .\artifacts\package\App -Recurse -Force
          Copy-Item .\installer\Uninstall.ps1 .\artifacts\package\App\Uninstall.ps1 -Force
          Copy-Item .\installer\INSTALL.cmd, .\installer\Install.ps1 .\artifacts\package -Force
          Compress-Archive -Path .\artifacts\package\* -DestinationPath .\artifacts\BlueBridge-v1.3.0-win-x64.zip -CompressionLevel Optimal

      - name: Publish v1.3.0 release
        if: startsWith(github.event.head_commit.message, 'Release BlueBridge')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create v1.3.0 .\artifacts\BlueBridge-v1.3.0-win-x64.zip `
            --title "BlueBridge 1.3.0" `
            --notes "First public BlueBridge release. Route Bluetooth device audio to any Windows playback endpoint, repair a silent stream on demand, and keep the app quietly in the notification area."
